[package]
name = "pewter-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
pewter-core = { path = "../pewter-core" }

anyhow = "1.0.103"
arrayvec = "0.7.8"
chrono = "0.4.45"
crossbeam-channel = "0.5.16"
rand = { version = "0.9.2", features = ["small_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor = "0.11.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
variant_count = "1.2.1"
zstd = "0.13.3"
